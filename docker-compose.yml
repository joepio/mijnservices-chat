services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mijnservices-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2
    container_name: mijnservices-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - DOMAIN=mijnservices.chat
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
